# modeldoki — LLMRouter Configuration
#
# Routes requests to the appropriate model based on the model name prefix.
#
# NOTE: one LM Studio instance serves a single OpenAI-compatible port (1234)
# and dispatches requests by the request's "model" field. Both upstreams
# therefore point at the same server; the routing rules below select which
# model identifier is used.

server:
  host: "127.0.0.1"
  port: 6666
  dashboard: true

upstreams:
  - name: "qwen-chat"
    model_prefix: "qwen2.5-7b-instruct"
    base_url: "http://127.0.0.1:1234"
    api_key: "not-needed"
    default: true
    timeout: 120s
    max_retries: 2

  - name: "qwen-coder"
    model_prefix: "qwen2.5-coder-7b-instruct"
    base_url: "http://127.0.0.1:1234"
    api_key: "not-needed"
    default: false
    timeout: 120s
    max_retries: 2

routing:
  rules:
    - description: "Route chat requests to Qwen 2.5 7B Instruct"
      match:
        model: "qwen2.5-7b-instruct*"
      upstream: "qwen-chat"

    - description: "Route coding requests to Qwen 2.5-Coder 7B Instruct"
      match:
        model: "qwen2.5-coder-7b-instruct*"
      upstream: "qwen-coder"

    - description: "Route 'coder' or 'code' in model name to coder upstream"
      match:
        model: "*coder*"
      upstream: "qwen-coder"

    - description: "Default fallback to chat model"
      match:
        model: "*"
      upstream: "qwen-chat"

logging:
  level: info
  format: text
  output: stdout
